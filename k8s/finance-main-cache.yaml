apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: finance-main-cache
  namespace: finance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: finance-main-cache
  template:
    metadata:
      labels:
        app: finance-main-cache
    spec:
      containers:
        - name: redis-cache
          image: redis:latest
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: finance-main-cache
  namespace: finance
spec:
  selector:
    app: redis-cache
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
  type: ClusterIP